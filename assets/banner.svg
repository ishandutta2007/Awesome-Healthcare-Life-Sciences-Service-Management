<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#091224" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#0EA5E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.12); }
      }
      @keyframes ecgMotion {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dataFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes beaconPulse {
        0%, 100% { opacity: 0.3; r: 3; }
        50% { opacity: 1; r: 5.5; }
      }

      .pulse-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .pulse-orb-2 {
        animation: pulseGlow 8s ease-in-out infinite alternate 1.5s;
        transform-origin: 1000px 320px;
      }
      .ecg-line {
        stroke-dasharray: 2400;
        animation: ecgMotion 7s linear infinite;
      }
      .pill-float {
        animation: dataFloat 5s ease-in-out infinite;
      }
      .pill-float-delayed {
        animation: dataFloat 5.5s ease-in-out infinite 1.2s;
      }
      .beacon {
        animation: beaconPulse 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- DYNAMIC BACKGROUND LAYER (Strictly background, non-intrusive) -->
  <g id="dynamic-ambient-background">
    <!-- Ambient Glow Orbs -->
    <circle class="pulse-orb-1" cx="220" cy="110" r="140" fill="#0284C7" filter="url(#softGlow)" />
    <circle class="pulse-orb-2" cx="980" cy="310" r="160" fill="#059669" filter="url(#softGlow)" />
    <circle cx="620" cy="200" r="180" fill="#4F46E5" filter="url(#softGlow)" opacity="0.15" />

    <!-- Animated ECG Pulse Rhythm in Background -->
    <path class="ecg-line" d="M 0 310 L 180 310 L 210 290 L 230 335 L 255 240 L 280 370 L 305 295 L 325 310 L 520 310 L 540 295 L 560 325 L 585 250 L 610 365 L 635 295 L 655 310 L 840 310 L 865 290 L 885 330 L 910 245 L 935 370 L 960 295 L 980 310 L 1200 310" 
          fill="none" stroke="url(#ecgGrad)" stroke-width="2.5" filter="url(#glow)" />

    <!-- Background Data Nodes / Hexagons -->
    <circle class="beacon" cx="280" cy="370" fill="#38BDF8" />
    <circle class="beacon" cx="610" cy="365" fill="#34D399" />
    <circle class="beacon" cx="935" cy="370" fill="#818CF8" />
  </g>

  <!-- FOREGROUND CONTENT LAYER (Guaranteed Crystal-Clear Contrast) -->
  <g id="foreground-content" transform="translate(60, 42)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="470" height="34" rx="17" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="18" cy="17" r="4.5" fill="#10B981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12.5" font-weight="700" fill="#E0F2FE" letter-spacing="1.2">
        HEALTHCARE &amp; LIFE SCIENCES SERVICE MANAGEMENT
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.8">
      Awesome Healthcare &amp; <tspan fill="url(#titleGrad)">Life Sciences</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Curated Directory of Enterprise SaaS Platforms, Clinical Workflows &amp; Open-Source Health IT
    </text>

    <!-- Interactive / Dynamic Foreground Feature Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g class="pill-float" transform="translate(0, 0)">
        <rect width="250" height="48" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">
          🩺 Clinical Workflows
        </text>
        <circle cx="230" cy="24" r="3.5" fill="#38BDF8" />
      </g>

      <!-- Pill 2 -->
      <g class="pill-float-delayed" transform="translate(268, 0)">
        <rect width="255" height="48" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">
          🔬 Life Sciences Ops &amp; CTMS
        </text>
        <circle cx="235" cy="24" r="3.5" fill="#34D399" />
      </g>

      <!-- Pill 3 -->
      <g class="pill-float" transform="translate(541, 0)">
        <rect width="260" height="48" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">
          ⚡ FHIR R4 &amp; Interoperability
        </text>
        <circle cx="240" cy="24" r="3.5" fill="#818CF8" />
      </g>

      <!-- Pill 4 -->
      <g class="pill-float-delayed" transform="translate(819, 0)">
        <rect width="260" height="48" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">
          🛡️ HIPAA &amp; 21 CFR Part 11
        </text>
        <circle cx="240" cy="24" r="3.5" fill="#F59E0B" />
      </g>
    </g>

    <!-- Bottom Stat / Credential Line -->
    <g transform="translate(2, 280)">
      <circle cx="6" cy="6" r="4" fill="#10B981" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">
        Open Source &amp; Enterprise Ecosystem • Regularly Updated • Community Maintained
      </text>
    </g>
  </g>
</svg>
